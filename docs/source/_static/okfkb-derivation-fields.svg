<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">OKFKB reciprocal derivation fields</title>
  <desc id="desc">A Finding points to a Concept through generated derives_to metadata, while the Concept records the authored derived_from source.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b6f8f"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a56a2a"/>
    </marker>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#fffdf8"/>
      <circle cx="2" cy="3" r="0.45" fill="#e8e1d5"/>
      <circle cx="9" cy="8" r="0.35" fill="#eee7dc"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#8f8a84" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#paper)"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#202020">
    <text x="600" y="37" text-anchor="middle" font-size="24" font-weight="700">One derivation, two frontmatter views</text>
    <text x="600" y="63" text-anchor="middle" font-size="13" fill="#5c6570">The authored source stays canonical; the reverse edge is materialized for navigation.</text>

    <g stroke="#4a4a4a" stroke-width="2" filter="url(#shadow)">
      <rect x="42" y="102" width="430" height="212" rx="12" fill="#dcecf7"/>
      <rect x="728" y="102" width="430" height="212" rx="12" fill="#f8e8c8"/>
    </g>

    <g font-size="17">
      <text x="70" y="137" font-weight="700">Finding · raw evidence</text>
      <text x="756" y="137" font-weight="700">Concept · stable understanding</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#33404a">
      <text x="70" y="164">findings/2026.07.04-21.35-hw-failure-</text>
      <text x="70" y="182">investigation.md</text>
      <text x="756" y="164">concepts/hardware-failures-have-a-</text>
      <text x="756" y="182">stress-signature.md</text>
    </g>

    <g stroke="#b8c8d3" stroke-width="1">
      <rect x="70" y="202" width="374" height="99" rx="6" fill="#f9fcfe"/>
      <rect x="756" y="202" width="374" height="99" rx="6" fill="#fffaf0"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="86" y="226" fill="#3b6f8f"># generated by okfkb update</text>
      <text x="86" y="250" font-weight="700">derives_to:</text>
      <text x="86" y="272">  - concepts/hardware-failures-have-a-</text>
      <text x="86" y="288">    stress-signature</text>
      <text x="772" y="226" fill="#a56a2a"># authored by an agent or human</text>
      <text x="772" y="250" font-weight="700">derived_from:</text>
      <text x="772" y="272">  - findings/2026.07.04-21.35-hw-failure-</text>
      <text x="772" y="288">    investigation</text>
    </g>

    <path d="M472 203 H728" fill="none" stroke="#3b6f8f" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <path d="M728 272 H472" fill="none" stroke="#a56a2a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
    <g text-anchor="middle" font-size="12" font-weight="700">
      <rect x="535" y="168" width="130" height="24" rx="5" fill="#fffdf8"/>
      <text x="600" y="185" fill="#3b6f8f">derives_to</text>
      <rect x="525" y="283" width="150" height="24" rx="5" fill="#fffdf8"/>
      <text x="600" y="300" fill="#a56a2a">derived_from</text>
    </g>

    <g text-anchor="middle">
      <rect x="500" y="337" width="200" height="43" rx="8" fill="#eef3e8" stroke="#71866a" stroke-width="1.5"/>
      <text x="600" y="355" font-size="12" font-weight="700">same relationship</text>
      <text x="600" y="371" font-size="11" fill="#4b5563">two navigation directions</text>
    </g>
    <text x="600" y="407" text-anchor="middle" font-size="12" fill="#5c6570">Use extensionless bundle-relative IDs. Run okfkb update; never hand-edit generated derives_to.</text>
  </g>
</svg>
