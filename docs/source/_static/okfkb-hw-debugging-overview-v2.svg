			<text x="720" y="310" font-size="16" font-weight="700">Concepts</text><text x="720" y="330" font-size="12">stable understanding · revised by evidence</text>
			<text x="720" y="410" font-size="17" font-weight="700">Findings · raw evidence</text><text x="720" y="430" font-size="12">immutable · contextual · supersedable</text>
		</g>
		<!-- provenance legend: kept below the content so links never cross explanatory text -->
		<g transform="translate(515 477)" fill="none" stroke="#566b8f" stroke-width="1.5" stroke-dasharray="5 4"><path d="M0 0H120"/><path d="M165 0H285"/></g>
