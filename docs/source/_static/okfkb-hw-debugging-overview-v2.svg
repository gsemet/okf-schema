		<text x="720" y="78" text-anchor="middle" font-size="20" font-weight="700">Knowledge Base Layers</text>
		<text x="1248" y="78" text-anchor="middle" font-size="20" font-weight="700">KB Navigation</text>

		<!-- session cards -->
		<g stroke="#4a4a4a" stroke-width="2" filter="url(#shadow)">
			<rect x="35" y="105" width="310" height="52" rx="12" fill="#fff"/>
			<rect x="35" y="174" width="310" height="52" rx="12" fill="#fff"/>
			<rect x="35" y="243" width="310" height="52" rx="12" fill="#fff"/>
			<rect x="35" y="312" width="310" height="52" rx="12" fill="#fff"/>
			<rect x="35" y="381" width="310" height="52" rx="12" fill="#fff"/>
		</g>
		<g fill="#cfe3f7" stroke="#4a4a4a" stroke-width="2">
			<rect x="53" y="118" width="25" height="25" rx="4"/><path d="M48 124h5m-5 7h5m-5 7h5m30-14h5m-5 7h5m-5 7h5M59 113v5m7-5v5m7-5v5M59 143v5m7-5v5m7-5v5"/>
			<rect x="53" y="187" width="25" height="25" rx="4"/><rect x="53" y="256" width="25" height="25" rx="4"/><rect x="53" y="325" width="25" height="25" rx="4"/><rect x="53" y="394" width="25" height="25" rx="4"/>
		</g>
		<g font-size="15"><text x="92" y="127" font-weight="700">Session 1 ·</text><text x="92" y="146">25°C boot hang</text><text x="92" y="196" font-weight="700">Session 2 ·</text><text x="92" y="215">0°C thermal sweep</text><text x="92" y="265" font-weight="700">Session 3 ·</text><text x="92" y="284">PLL lock measurement</text><text x="92" y="334" font-weight="700">Session 4 ·</text><text x="92" y="353">bootloader source review</text><text x="92" y="403" font-weight="700">Session 5 ·</text><text x="92" y="422">fix validated</text></g>
