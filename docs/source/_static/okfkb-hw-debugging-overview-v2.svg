			<text x="910" y="272" font-weight="700">ppl.md</text><text x="910" y="291">0°C margin: 950µs</text>
			<text x="910" y="345" font-weight="700">2026.08-ppl.md</text><text x="910" y="364">0°C: lock at 950µs</text>
		</g>
		<!-- layer-to-layer progression: both curves stay outside the pyramid and enter at layer boundaries -->
		<g fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow-blue)">
			<path d="M496 420C455 405 451 352 505 326C526 316 546 322 563 324"/>
			<path d="M563 324C523 306 523 254 570 230C590 220 614 224 630 227"/>
		</g>
		<g font-size="11" fill="#4a4a4a" text-anchor="middle">
			<rect x="448" y="350" width="60" height="22" rx="5" fill="#fff"/>
			<text x="478" y="365" text-anchor="middle">corroborate</text>
			<rect x="484" y="212" width="92" height="36" rx="5" fill="#fff"/><text x="530" y="227">consolidate</text><text x="530" y="241">mental model</text>
		</g>
		<!-- storage note: avoids placing cards over the pyramid boundary -->
		<g fill="#fff" stroke="#566b8f" stroke-width="1.5"><rect x="820" y="477" width="155" height="32" rx="8"/></g>
		<text x="897" y="498" text-anchor="middle" font-size="11" fill="#566b8f">Markdown + Git</text>

		<!-- navigation -->
		<g stroke="#4a4a4a" stroke-width="2"><circle cx="1100" cy="125" r="19" fill="#cfe3f7"/><path d="M1087 139q13-25 26 0" fill="#f7cbc5"/><circle cx="1100" cy="119" r="7" fill="#fff"/></g><rect x="1130" y="99" width="250" height="52" rx="12" fill="#fff" stroke="#4a4a4a" stroke-width="2"/><text x="1145" y="120" font-size="14">Why does boot hang</text><text x="1145" y="139" font-size="14">at low temperature?</text>
		<text x="1240" y="180" text-anchor="middle" font-size="14" font-weight="700">Navigation Tools</text><g stroke="#4a4a4a" stroke-width="1.5"><rect x="1090" y="193" width="62" height="25" rx="12" fill="#fff"/><rect x="1163" y="193" width="62" height="25" rx="12" fill="#fff"/><rect x="1236" y="193" width="62" height="25" rx="12" fill="#fff"/><rect x="1309" y="193" width="62" height="25" rx="12" fill="#fff"/></g><g text-anchor="middle" font-size="12"><text x="1121" y="210">search</text><text x="1194" y="210">get</text><text x="1267" y="210">read</text><text x="1340" y="210">query</text></g>
		<g stroke="#4a4a4a" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M1240 248V276"/><path d="M1240 338V366"/><path d="M1240 428V456"/></g>
		<g stroke="#566b8f" stroke-width="2"><rect x="1090" y="276" width="300" height="62" rx="10" fill="#e3d4f2"/><rect x="1090" y="366" width="300" height="62" rx="10" fill="#fbf0c4"/><rect x="1090" y="456" width="300" height="58" rx="10" fill="#d8ead7"/></g>
		<g font-size="12"><text x="1105" y="298" font-weight="700">1 · Start at Structures + Concepts</text><text x="1105" y="318">Findings are not read by default.</text><text x="1105" y="388" font-weight="700">2 · Concept is incomplete</text><text x="1105" y="408">Drill down into current Findings.</text><text x="1105" y="478" font-weight="700">3 · Answer</text><text x="1105" y="498">Poll PLL_LOCK; 400µs is too short.</text></g>
		<text x="720" y="528" text-anchor="middle" font-size="12" fill="#4b5563">Findings read only when a concept is incomplete · Principles checked for company-rule fit</text>
