<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
	<title id="title">OKF-KB hardware debugging overview</title>
	<desc id="desc">A hand-drawn-style systems diagram showing debug sessions producing Findings, which are distilled into Concepts and Structures, while Principles remain human governed. An agent navigates the layers to answer a low-temperature boot question.</desc>
	<defs>
		<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4a4a4a"/></marker>
		<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#566b8f"/></marker>
		<pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fff"/><circle cx="2" cy="3" r=".45" fill="#e5e1dc"/><circle cx="9" cy="8" r=".35" fill="#ebe7e2"/></pattern>
		<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#8f8a84" flood-opacity=".25"/></filter>
	</defs>
	<rect width="1440" height="540" rx="18" fill="url(#paper)"/>
	<g font-family="sans-serif" fill="#202020">
