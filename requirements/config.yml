version: 1
levels:
  StRS: {folder: strs, prefix: StRS-OKFSCHEMA, derives_from: []}
  SwRS: {folder: swrs, prefix: SwRS-OKFSCHEMA, derives_from: [StRS]}
id_policy: scope-prefix-sequence
lifecycle:
  values: [draft, proposed, approved, deprecated, superseded]
markers:
  implements: '@implements_req'
  tests: '@tests_req'
  id_pattern: '[A-Za-z][A-Za-z0-9_-]*'
generated_fields: [derived_by, implemented_in_files, tested_in_files]
scopes:
  core:
    id_token: CORE
    folder: core
    source_dirs: [src/okf_schema/__init__.py, src/okf_schema/_internal, src/okf_schema/api.py, src/okf_schema/cli.py, src/okf_schema/formatter.py, src/okf_schema/schemas, src/okf_schema/validator.py]
    test_dirs: [tests/test_api.py, tests/test_cli_core.py, tests/test_cli_remaining.py, tests/test_edge_cases.py, tests/test_formatter.py, tests/test_integration.py, tests/test_internal.py, tests/test_okf2_compliance.py, tests/test_package.py, tests/test_validator.py]
  okfkb:
    id_token: OKFKB
    folder: okfkb
    source_dirs: [src/okf_schema/okfkb, src/okf_schema/data/kb/skills]
    test_dirs: [tests/test_kb_cli.py, tests/test_kb_derivations.py, tests/test_kb_finding.py, tests/test_kb_install.py, tests/test_kb_navigate.py, tests/test_kb_patterns.py, tests/test_kb_scaffold.py]
  okfreq:
    id_token: OKFREQ
    folder: okfreq
    source_dirs: [src/okf_schema/okfreq, src/okf_schema/data/requirements]
    test_dirs: [tests/test_okfreq.py]
