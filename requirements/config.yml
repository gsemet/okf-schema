version: 1
tiers:
  StRS: {folder: strs, prefix: StRS-OKFSCHEMA, derives_from: [], approval_lock: true,
    owner_email: gaetan@xeberon.net}
  SwRS: {folder: swrs, prefix: SwRS-OKFSCHEMA, derives_from: [StRS], approval_lock: false,
    owner_email: gaetan@xeberon.net}
id_policy: scope-prefix-sequence
strs_test_coverage_mode: linked-swrs-and-validation-test
lifecycle:
  field: lifecycle
markers:
  implements: '@implements_req'
  tests: '@tests_req'
  id_pattern: '[A-Za-z][A-Za-z0-9_-]*'
generated_fields: [derived_by, supersedes, implemented_in_files, tested_in_files, default_owner_email]
scopes:
  core:
    id_token: CORE
    folder: core
    source_dirs: [src/okf_schema/__init__.py, src/okf_schema/_internal,
        src/okf_schema/api.py, src/okf_schema/cli.py,
        src/okf_schema/file_links.py, src/okf_schema/formatter.py,
        src/okf_schema/schemas, src/okf_schema/validator.py]
    test_dirs: [tests/test_api.py, tests/test_cli_core.py,
        tests/test_cli_remaining.py, tests/test_edge_cases.py,
        tests/test_file_links.py, tests/test_formatter.py,
        tests/test_integration.py, tests/test_internal.py,
        tests/test_okf2_compliance.py, tests/test_package.py,
        tests/test_validator.py, tests/test_examples.py]
  okfkb:
    id_token: OKFKB
    folder: okfkb
    source_dirs: [src/okf_schema/okfkb, src/okf_schema/skill_installer.py,
        skills/okfkb-distill]
    test_dirs: [tests/test_kb_cli.py, tests/test_kb_derivations.py,
        tests/test_kb_finding.py, tests/test_kb_install.py,
        tests/test_kb_navigate.py, tests/test_kb_patterns.py,
        tests/test_kb_scaffold.py, tests/test_skill_installer.py,
        tests/test_skill_resources.py, tests/test_tutorial_okfkb.py]
  okfreq:
    id_token: OKFREQ
    folder: okfreq
    source_dirs: [src/okf_schema/okfreq, src/okf_schema/data/requirements,
        skills/okfreq, skills/okfreq-gardening, skills/okfreq-setup,
        examples/okfreq-examples/showcase.py]
    test_dirs: [tests/test_okfreq.py, tests/test_file_links.py,
        tests/test_examples.py, tests/test_skill_resources.py,
        tests/test_okfreq_cli.py, tests/test_requirement_indexes.py,
        tests/test_tutorial_okfreq.py]
