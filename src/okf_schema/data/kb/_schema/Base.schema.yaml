$schema: "http://json-schema.org/draft-07/schema#"
title: Base
description: Common frontmatter fields shared by all knowledge-base documents.
type: object
required: [type, title, description]
properties:
  type:
    description: Document type discriminator.
    type: string
  title:
    description: Human-readable title of the document.
    type: string
    minLength: 1
  description:
    description: Short summary of what the document covers.
    type: string
    minLength: 1
  tags:
    description: Keywords for categorization and search.
    type: array
    items: { type: string }
  generated:
    description: OKF 0.2 provenance block recording when and by whom the document was generated.
    type: object
    required: [at]
    properties:
      at:
        description: ISO 8601 creation or last-updated timestamp.
        type: string
        format: date-time
      by:
        description: Actor string identifying the producer (e.g. 'human:alice', 'bot:ci').
        type: string
  timestamp:
    description: >-
      Deprecated (OKF 0.1). ISO 8601 creation timestamp. Prefer 'generated.at'.
    type: string
    format: date-time
  verified:
    description: OKF 0.2 trust attestation list.
    oneOf:
      - type: array
        items:
          type: object
          required: [by, at]
          properties:
            by: { type: string }
            at: { type: string }
            method: { type: string }
      - type: object
        required: [by, at]
        properties:
          by: { type: string }
          at: { type: string }
          method: { type: string }
  status:
    description: OKF 0.2 lifecycle state (draft, stable, or deprecated).
    type: string
    enum: [draft, stable, deprecated]
  stale_after:
    description: ISO 8601 date after which the document is considered stale.
    type: string
  kb_status:
    description: KB-internal lifecycle state (active, contradicted, superseded).
    type: string
    enum: [active, contradicted, superseded]
  links:
    type: array
    items:
      type: string
    description: "Bundle-relative paths this concept links to"
  backlinks:
    type: array
    items:
      type: string
    description: "Bundle-relative paths of concepts that link to this one"
