name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run preflight
        run: uv run --no-sync -- just preflight

      - name: Upload requirements report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-report-${{ matrix.python-version }}
          path: |
            dist/requirements-report.json
            dist/requirements-report.schema.json
            dist/requirements-report.md
          if-no-files-found: warn

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  cross-platform:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run preflight
        run: uv run --no-sync -- just preflight

  tag-release:
    needs: [preflight, cross-platform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Tag a committed version bump
        id: tag
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: uv run --group release python scripts/version.py --tag-before "$BEFORE_SHA"
      # PyPI Trusted Publishing cannot use a reusable workflow, so dispatch publish.yml.
      - name: Start the release workflow
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run publish.yml --ref main -f tag="$RELEASE_TAG"
