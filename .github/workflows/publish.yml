name: Publish

on:
  release:
    types: [published]

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG.md
        run: >-
          python .github/scripts/extract-release-notes.py
          "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --notes-file "$RUNNER_TEMP/release-notes.md"

  preflight:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [preflight, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/okf-schema
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
