$schema: https://json-schema.org/draft/2020-12/schema
$id: base.schema.yaml
title: okfreq requirement base profile
type: object
properties:
  type:
    type: string
  id:
    type: string
  uuid:
    type: string
    format: uuid
  title:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  project:
    type: string
    minLength: 1
  scope:
    type: string
    minLength: 1
  lifecycle:
    type: string
  origin:
    type: string
    minLength: 1
  tier:
    type: string
  derives_from:
    type: array
    items:
      type: string
  derived_by:
    type: array
    items:
      type: string
  depends_on:
    type: array
    items:
      type: string
required:
- type
- id
- uuid
- title
- description
- project
- scope
- lifecycle
- origin
- tier
additionalProperties: true

