$schema: https://json-schema.org/draft/2020-12/schema
$id: base.schema.yaml
title: okfreq requirement base profile
type: object
properties:
  type:
    type: string
    description: Document type; selects which tier profile applies.
  id:
    type: string
    description: Human-readable requirement identifier, e.g. SwRS-CORE-002.
  uuid:
    type: string
    format: uuid
    description: Stable UUIDv4 identifying this requirement across renames.
  title:
    type: string
    minLength: 1
    description: Short, imperative summary of the requirement.
  description:
    type: string
    minLength: 1
    description: Full requirement statement in EARS or plain prose.
  project:
    type: string
    minLength: 1
    description: Project code this requirement belongs to.
  scope:
    type: string
    minLength: 1
    description: Functional scope, e.g. Core, Safety, Connectivity.
  req_lifecycle:
    type: string
    enum:
    - draft
    - proposed
    - approved
    - deprecated
    - superseded
    description: |
      Explicit, human-controlled lifecycle state.
      - draft: a requirement proposal that is not implemented yet. A project whose
        requirements are delivered with the code they describe should not keep drafts
        on its default branch.
      - proposed: implemented and in force, but not frozen. It may change through the
        usual plan and review, without an explicit owner agreement.
      - approved: frozen by its owner. Any significant change (normative statement,
        scenarios, criteria, deprecation or supersession) needs the owner's explicit,
        justified agreement, recorded in approved_by and approved_at. Allowed only where
        approval_lock is true for the requirement's tier and scope.
      - deprecated: no longer in force and not replaced; kept for history.
      - superseded: replaced by the requirements listed in superseded_by; kept for history.
      OKF consumers read the generated status mapped by x-okf-status-projection.
    x-okf-status-projection:
      draft: draft
      proposed: stable
      approved: stable
      deprecated: deprecated
      superseded: deprecated
  status:
    type: string
    enum:
    - draft
    - stable
    - deprecated
    description: Generated OKF lifecycle (OKF section 5.4), mapped from
      req_lifecycle by x-okf-status-projection, so a plain OKF consumer reads
      it. Never edit it by hand.
  owner_email:
    type: string
    format: email
    description: Authored owner of this requirement. Overrides
      default_owner_email; the owner approves the requirement and any change to
      it once approved.
  default_owner_email:
    type: string
    format: email
    description: 'Generated owner from config.yml: scopes.<scope>.tiers.<tier>.owner_email,
      else scopes.<scope>.owner_email, else tiers.<tier>.owner_email. Absent when
      none is configured. owner_email, when set, replaces it.'
  approved_by:
    type: string
    format: email
    description: Email of the owner who approved the current content. Required
      when the lifecycle is approved; set only on the owner's explicit
      agreement, never by an agent's own decision.
  approved_at:
    type: string
    format: date-time
    description: ISO 8601 datetime with an explicit UTC offset (for example
      2026-10-28T09:00:00+01:00) of the owner's approval of the current content.
      Required when the lifecycle is approved; updated with every agreed change.
  verified:
    type: object
    properties:
      by:
        type: string
      at:
        type: string
        format: date-time
    description: 'Generated OKF trust event (OKF section 5.2): by human:<approved_by>
      at approved_at, so an approved requirement reads as human-reviewed. Never edit
      it by hand.'
  origin:
    type: string
    minLength: 1
    description: Where the requirement came from, e.g. native, imported,
      elicited.
  tier:
    type: string
    description: Requirement tier; must match the document's directory profile.
  derives_from:
    type: array
    items:
      type: string
      x-okf-link:
        resolution: filename-stem
        syntax: plain
        id_marker: id
        tooltip_shows_fields:
        - description
        preview_shows_fields:
        - description
        link-projection: Derives from
    description: Upstream requirement IDs this one is derived from.
  derived_by:
    type: array
    items:
      type: string
      x-okf-link:
        resolution: filename-stem
        syntax: plain
        id_marker: id
        tooltip_shows_fields:
        - description
        preview_shows_fields:
        - description
        link-projection: Derived by
    description: Downstream requirement IDs deriving this one.
  depends_on:
    type: array
    items:
      type: string
      x-okf-link:
        resolution: filename-stem
        syntax: plain
        id_marker: id
        link-projection: Depends on
    description: Other requirement IDs this one depends on.
  superseded_by:
    type: array
    items:
      type: string
      x-okf-link:
        resolution: filename-stem
        syntax: plain
        id_marker: id
        tooltip_shows_fields:
        - description
        preview_shows_fields:
        - description
        link-projection: Superseded by
    description: Requirement IDs that replace this one; required when the
      lifecycle is superseded and forbidden otherwise.
  supersedes:
    type: array
    items:
      type: string
      x-okf-link:
        resolution: filename-stem
        syntax: plain
        id_marker: id
        tooltip_shows_fields:
        - description
        preview_shows_fields:
        - description
        link-projection: Supersedes
    description: Generated IDs of the requirements this one replaces.
  relates_to:
    type: array
    items:
      type: string
      x-okf-link:
        resolution: filename-stem
        syntax: plain
        id_marker: id
        tooltip_shows_fields:
        - description
        preview_shows_fields:
        - description
        link-projection: Relates to
    description: Requirement IDs this one is laterally related to; carries no
      derivation, supersession or coverage meaning.
required:
- type
- id
- uuid
- title
- description
- project
- scope
- req_lifecycle
- origin
- tier
additionalProperties: true

