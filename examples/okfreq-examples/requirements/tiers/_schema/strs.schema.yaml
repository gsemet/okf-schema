$schema: https://json-schema.org/draft/2020-12/schema
$id: strs.schema.yaml
title: okfreq strs requirement profile
description: StRS records stakeholder intent and carries no implementation
  fields; in mode linked-swrs-and-acceptance-paths it carries the generated
  tested_in_files and accepted_in_files.
allOf:
- $ref: base.schema.yaml
- type: object
  properties:
    type:
      const: StRS
      description: Fixed document type for stakeholder requirements.
    tier:
      const: StRS
      description: Fixed tier for stakeholder requirements.
    user_need:
      type: string
      minLength: 1
      description: The stakeholder need this requirement formalizes.
    tested_in_files:
      type: array
      description: Generated test paths.
      items:
        type: string
        x-okf-link:
          resolution: project-relative
          syntax: plain
          basename_marker: '@tests_req'
          id_marker: id
          show_line_number: true
    accepted_in_files:
      type: array
      description: 'Generated acceptance-test paths: files of @accepts_req markers
        that count, in mode linked-swrs-and-acceptance-paths.'
      items:
        type: string
        x-okf-link:
          resolution: project-relative
          syntax: plain
          basename_marker: '@accepts_req'
          id_marker: id
          show_line_number: true
    acceptance_exemption:
      type: boolean
      description: 'Authored StRS waiver: true when the whole requirement cannot be
        acceptance-tested by an automated test. Requires a non-empty acceptance_exemption_reason.
        A waiver is not acceptance evidence.'
    acceptance_exemption_reason:
      type: string
      minLength: 1
      description: Why automated acceptance is not possible for this StRS.
        Reviewed by the owner and removed when no longer justified.
  required:
  - type
  - tier
  - user_need
  allOf:
  - if:
      required:
      - acceptance_exemption
      properties:
        acceptance_exemption:
          const: true
    then:
      required:
      - acceptance_exemption_reason

